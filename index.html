<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>telega</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-screen">
        <div id="auth-box">
            <div id="auth-tabs">
                <div class="auth-tab active" data-mode="login">Вход</div>
                <div class="auth-tab" data-mode="register">Регистрация</div>
            </div>
            <input id="auth-username" type="text" placeholder="Логин" autofocus>
            <input id="auth-password" type="password" placeholder="Пароль">
            <div id="auth-error"></div>
            <button id="auth-submit">Войти</button>
        </div>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div id="room-list"></div>
            <div id="room-create">
                <input id="room-create-input" type="text" placeholder="Новая комната...">
            </div>
        </div>
        <div id="chat-area">
            <div id="messages"></div>
            <div id="reply-preview">
                <span id="reply-preview-text"></span>
                <span id="reply-preview-cancel">✕</span>
            </div>
            <input id="input" type="text" placeholder="Написать сообщение...">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
