<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>telega</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background: #1e1f22;
            color: #e3e3e3;
            font-family: system-ui, sans-serif;
        }

        #auth-screen {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
        }

        #auth-screen.visible {
            display: flex;
        }

        #auth-box {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 8px;
            background: #2b2d31;
            color: #9aa0a6;
            cursor: pointer;
        }

        .auth-tab.active {
            background: #2e5c8a;
            color: #e3e3e3;
        }

        #auth-box input {
            border: none;
            outline: none;
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 8px;
            background: #2b2d31;
            color: #e3e3e3;
        }

        #auth-box input::placeholder {
            color: #8b8d92;
        }

        #auth-submit {
            border: none;
            outline: none;
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 8px;
            background: #2e5c8a;
            color: #e3e3e3;
            cursor: pointer;
        }

        #auth-error {
            display: none;
            color: #e37a7a;
            font-size: 13px;
        }

        #chat-screen {
            display: none;
            flex: 1;
            min-height: 0;
        }

        #sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #26282c;
            border-right: 1px solid #1e1f22;
        }

        #room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #9aa0a6;
        }

        .room-item:hover {
            background: #2b2d31;
        }

        .room-item.active {
            background: #2e5c8a;
            color: #e3e3e3;
        }

        .room-item .room-count {
            font-size: 12px;
            color: #8b8d92;
        }

        #room-create {
            display: flex;
            padding: 8px;
            border-top: 1px solid #1e1f22;
        }

        #room-create input {
            flex: 1;
            border: none;
            outline: none;
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 8px;
            background: #2b2d31;
            color: #e3e3e3;
        }

        #room-create input::placeholder {
            color: #8b8d92;
        }

        #chat-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message {
            align-self: flex-start;
            max-width: 60%;
            padding: 8px 12px;
            border-radius: 12px;
            background: #2b2d31;
            word-break: break-word;
        }

        .message.own {
            align-self: flex-end;
            background: #2e5c8a;
        }

        .message .nickname {
            font-weight: 600;
            color: #7aa2f7;
        }

        .message.own .nickname {
            color: #cfe4ff;
        }

        .message .text {
            color: #e3e3e3;
        }

        .message .reply-btn {
            margin-left: 8px;
            opacity: 0;
            cursor: pointer;
            color: #8b8d92;
        }

        .message:hover .reply-btn {
            opacity: 1;
        }

        .message .quote {
            display: block;
            margin-bottom: 4px;
            padding-left: 8px;
            border-left: 2px solid #7aa2f7;
            color: #9aa0a6;
            font-size: 13px;
        }

        #reply-preview {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #26282c;
            color: #9aa0a6;
            font-size: 13px;
            border-left: 2px solid #7aa2f7;
        }

        #reply-preview.active {
            display: flex;
        }

        #reply-preview-cancel {
            cursor: pointer;
            color: #8b8d92;
            padding: 0 6px;
        }

        #input {
            border: none;
            outline: none;
            padding: 14px 16px;
            font-size: 15px;
            background: #2b2d31;
            color: #e3e3e3;
        }

        #input::placeholder {
            color: #8b8d92;
        }
    </style>
</head>
<body>
    <div id="auth-screen">
        <div id="auth-box">
            <div id="auth-tabs">
                <div class="auth-tab active" data-mode="login">Вход</div>
                <div class="auth-tab" data-mode="register">Регистрация</div>
            </div>
            <input id="auth-username" type="text" placeholder="Логин" autofocus>
            <input id="auth-password" type="password" placeholder="Пароль">
            <div id="auth-error"></div>
            <button id="auth-submit">Войти</button>
        </div>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div id="room-list"></div>
            <div id="room-create">
                <input id="room-create-input" type="text" placeholder="Новая комната...">
            </div>
        </div>
        <div id="chat-area">
            <div id="messages"></div>
            <div id="reply-preview">
                <span id="reply-preview-text"></span>
                <span id="reply-preview-cancel">✕</span>
            </div>
            <input id="input" type="text" placeholder="Написать сообщение...">
        </div>
    </div>

    <script>
        const authScreen = document.getElementById("auth-screen");
        const chatScreen = document.getElementById("chat-screen");
        const authTabs = document.querySelectorAll(".auth-tab");
        const authUsername = document.getElementById("auth-username");
        const authPassword = document.getElementById("auth-password");
        const authError = document.getElementById("auth-error");
        const authSubmit = document.getElementById("auth-submit");

        let authMode = "login"; // "login" или "register"

        authTabs.forEach((tab) => {
            tab.addEventListener("click", () => {
                authMode = tab.dataset.mode;
                authTabs.forEach((t) => t.classList.toggle("active", t === tab));
                authSubmit.textContent = authMode === "login" ? "Войти" : "Зарегистрироваться";
                authError.style.display = "none";
            });
        });

        authSubmit.addEventListener("click", async () => {
            const username = authUsername.value;
            const password = authPassword.value;
            if (!username || !password) {
                return;
            }
            try {
                const response = await fetch("/" + authMode, {
                    method: "POST",
                    credentials: "same-origin",
                    body: JSON.stringify({ username, password }),
                });
                if (!response.ok) {
                    const text = await response.text();
                    authError.textContent = text || "Ошибка";
                    authError.style.display = "block";
                    return;
                }
                startChat(username);
            } catch (err) {
                authError.textContent = "Не удалось связаться с сервером";
                authError.style.display = "block";
            }
        });

        function startChat(myNickname) {
            authScreen.classList.remove("visible");
            chatScreen.style.display = "flex";

            const roomList = document.getElementById("room-list");
            const roomCreateInput = document.getElementById("room-create-input");
            const messages = document.getElementById("messages");
            const input = document.getElementById("input");
            const replyPreview = document.getElementById("reply-preview");
            const replyPreviewText = document.getElementById("reply-preview-text");
            const replyPreviewCancel = document.getElementById("reply-preview-cancel");

            let socket = null;
            let currentRoom = null;
            let messagesById = new Map(); // для резолва цитаты по id, только среди уже отрисованных в текущей комнате
            let replyingTo = null; // { id, nickname, text } или null

            function setReplyingTo(msg) {
                replyingTo = msg;
                if (msg) {
                    replyPreviewText.textContent = "Ответ " + msg.nickname + ": " + msg.text;
                    replyPreview.classList.add("active");
                } else {
                    replyPreview.classList.remove("active");
                }
            }

            replyPreviewCancel.addEventListener("click", () => setReplyingTo(null));

            function renderMessage(data) {
                messagesById.set(data.id, { nickname: data.nickname, text: data.text });

                const line = document.createElement("div");
                line.classList.add("message", data.nickname === myNickname ? "own" : "other");

                if (data.reply_to) {
                    const quoted = messagesById.get(data.reply_to);
                    const quoteDiv = document.createElement("span");
                    quoteDiv.classList.add("quote");
                    quoteDiv.textContent = quoted ? quoted.nickname + ": " + quoted.text : "сообщение";
                    line.appendChild(quoteDiv);
                }

                const nameSpan = document.createElement("span");
                nameSpan.classList.add("nickname");
                nameSpan.textContent = data.nickname;

                const textSpan = document.createElement("span");
                textSpan.classList.add("text");
                textSpan.textContent = ": " + data.text;

                const replyBtn = document.createElement("span");
                replyBtn.classList.add("reply-btn");
                replyBtn.textContent = "↩";
                replyBtn.addEventListener("click", () => setReplyingTo({ id: data.id, nickname: data.nickname, text: data.text }));

                line.appendChild(nameSpan);
                line.appendChild(textSpan);
                line.appendChild(replyBtn);
                messages.appendChild(line);
            }

            function connectToRoom(room) {
                if (room === currentRoom) {
                    return;
                }
                if (socket) {
                    socket.onclose = null; // не реагируем на закрытие, которое сами же и инициировали
                    socket.onmessage = null; // старое соединение не должно рисовать в уже переключённый чат
                    socket.close();
                }
                currentRoom = room;
                messages.innerHTML = "";
                messagesById = new Map();
                setReplyingTo(null);
                highlightActiveRoom();

                socket = new WebSocket("ws://" + location.host + "/ws?room=" + encodeURIComponent(room));
                socket.onmessage = (event) => renderMessage(JSON.parse(event.data));
                input.focus();
            }

            function highlightActiveRoom() {
                roomList.querySelectorAll(".room-item").forEach((el) => {
                    el.classList.toggle("active", el.dataset.room === currentRoom);
                });
            }

            function renderRooms(roomsMap) {
                const names = Object.keys(roomsMap).sort();
                roomList.innerHTML = "";
                names.forEach((name) => {
                    const item = document.createElement("div");
                    item.classList.add("room-item");
                    item.dataset.room = name;
                    item.textContent = name;
                    const count = document.createElement("span");
                    count.classList.add("room-count");
                    count.textContent = (roomsMap[name] || []).length;
                    item.appendChild(count);
                    item.addEventListener("click", () => connectToRoom(name));
                    roomList.appendChild(item);
                });
                highlightActiveRoom();
            }

            async function refreshRooms() {
                try {
                    const response = await fetch("/rooms", { credentials: "same-origin" });
                    if (!response.ok) {
                        return;
                    }
                    const roomsMap = await response.json();
                    renderRooms(roomsMap);
                } catch (err) {
                    // тихо игнорируем — следующий тик обновит
                }
            }

            roomCreateInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter" && roomCreateInput.value !== "") {
                    connectToRoom(roomCreateInput.value);
                    roomCreateInput.value = "";
                    refreshRooms(); // не ждать следующего тика опроса, обновить сайдбар сразу
                }
            });

            input.addEventListener("keydown", (event) => {
                if (event.key === "Enter" && input.value !== "" && socket) {
                    const payload = { text: input.value };
                    if (replyingTo) {
                        payload.reply_to = replyingTo.id;
                    }
                    socket.send(JSON.stringify(payload));
                    input.value = "";
                    setReplyingTo(null);
                }
            });

            messages.textContent = "Выбери комнату слева или создай новую";
            refreshRooms();
            setInterval(refreshRooms, 1500);
        }

        // при загрузке страницы — проверить, нет ли уже валидной сессии (cookie),
        // чтобы не заставлять логиниться заново после обновления страницы.
        // Пока идёт проверка, оба экрана скрыты (см. #auth-screen в CSS) —
        // чтобы не мелькал экран входа перед тем, как окажется, что мы уже залогинены.
        (async () => {
            try {
                const response = await fetch("/me", { credentials: "same-origin" });
                if (response.ok) {
                    const data = await response.json();
                    startChat(data.username);
                    return;
                }
            } catch (err) {
                // сервер недоступен — тоже считаем, что не залогинены
            }
            authScreen.classList.add("visible");
        })();
    </script>
</body>
</html>
